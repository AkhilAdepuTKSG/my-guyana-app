# Static SPA. Adapted from MPS-Guyana/frontend/nginx/default.conf.template, minus
# the proxy blocks: this app has no backend — every "API" call lives in the
# browser (src/api/* over IndexedDB) — so there is nothing to forward and no
# runtime variable to substitute. A plain conf, not a template, on purpose.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA entry point, never cached: it names the hashed asset files, so a
    # stale copy would ask the browser for chunks a redeploy has already removed.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Vite's build output carries a content hash in its filename, so it is safe
    # to pin. Only /assets/ — the files copied straight from public/ (favicon,
    # icons.svg, sample-docs/*) are NOT hashed and must not be marked immutable.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback: every client-side route answers with index.html rather than
    # a 404. Real files (public/ contents, sample-docs, process.html) win first,
    # matching the rewrite rule in vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
